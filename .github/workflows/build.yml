# Studio : vérifications et publication (runners Linux uniquement : pas de macOS, trop cher en abonnement gratuit).
#   check   → types TypeScript stricts, build, cache hors ligne complet, aucun secret dans le code
#   release → à chaque push sur main (et sur un tag v…), publie une Release avec l'app web,
#             et le paquet @mtthoas/studio (app web compilée) dans les Packages du dépôt
#
# Les apps natives (Mac, iPhone) ne sont plus compilées ici : `./native/build-mac.sh` sur ton Mac.
# Une PR (ou une branche lancée à la main : Actions → Build → Run workflow) ne lance que les vérifications.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Par défaut, le jeton du workflow ne peut que lire le dépôt.
permissions:
  contents: read

# Un seul build à la fois par PR (ou par branche lancée à la main) : un nouveau push annule le build devenu périmé.
# Jamais sur main ni sur un tag : chaque fusion doit aller jusqu'à sa publication. Leur groupe est donc propre à
# chaque exécution : dans un groupe partagé, GitHub ne garde qu'UN build en attente et annule les autres, même sans
# `cancel-in-progress` (deux fusions rapprochées, et la première publication disparaissait).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Types (TypeScript strict)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Vérifications du build
        run: npm run check
      - name: Archiver l'app web
        run: cd dist && zip -qr ../Studio-web.zip . -x '*.map'
      - uses: actions/upload-artifact@v7
        with:
          name: Studio-web
          path: Studio-web.zip
          retention-days: 30

  release:
    name: Publication
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # créer la Release
      packages: write   # publier le paquet dans GitHub Packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@mtthoas'
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Push sur main : version de package.json + numéro de build (ex. 1.0.42)
            VERSION="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: Studio-web
      - name: Créer la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" Studio-web.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Studio $TAG" --generate-notes
      - name: Publier le paquet @mtthoas/studio
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p pkg/dist && unzip -q Studio-web.zip -d pkg/dist
          cp README.md LICENSE pkg/
          node -e '
            const fs = require("fs");
            fs.writeFileSync("pkg/package.json", JSON.stringify({
              name: "@mtthoas/studio",
              version: process.env.VERSION,
              description: "Studio : notes, tâches, Linear et GitHub au même endroit, chiffrés, sans serveur. Application web compilée (dist/).",
              license: "AGPL-3.0-only",
              repository: { type: "git", url: "https://github.com/MTthoas/Studio.git" },
              files: ["dist", "README.md", "LICENSE"],
              publishConfig: { registry: "https://npm.pkg.github.com" }
            }, null, 2));'
          cd pkg && npm publish
