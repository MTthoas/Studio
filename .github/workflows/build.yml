# Studio : vérifications, builds et publication.
#   check   → types TypeScript stricts, build, cache hors ligne complet, aucun secret dans le code
#   macos   → construit Studio.app (Apple Silicon + Intel) ; signée Developer ID et notarisée pour une
#             publication si les secrets Apple sont renseignés, sinon signée « ad hoc »
#   ios     → vérifie que l'app iPhone compile (sans signature : non installable, voir README)
#   release → à chaque push sur main (et sur un tag v…), publie une Release avec l'app Mac et l'app web,
#             et le paquet @mtthoas/studio (app web compilée) dans les Packages du dépôt
#
# Quand le build se lance :
#   - push sur main ou tag v…  → build complet + publication ;
#   - pull request (ouverte, ou branche re-poussée) → build de vérification, une seule fois par push ;
#   - push sur une autre branche → rien (avant, chaque push d'agent lançait deux builds : « push » ET « pull_request »,
#     dans deux groupes de concurrence différents ; le second annulait parfois le premier, d'où des builds « au hasard »).
#   Une branche poussée sans PR se vérifie à la main : Actions → Build → Run workflow.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Par défaut, le jeton du workflow ne peut que lire le dépôt.
permissions:
  contents: read

# Un seul build à la fois par PR (ou par branche) : un nouveau push annule le build devenu périmé.
# Jamais sur main ni sur un tag : chaque fusion doit aller jusqu'à sa publication.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Types (TypeScript strict)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Vérifications du build
        run: npm run check
      - name: Archiver l'app web
        run: cd dist && zip -qr ../Studio-web.zip . -x '*.map'
      - uses: actions/upload-artifact@v7
        with:
          name: Studio-web
          path: Studio-web.zip
          retention-days: 30

  macos:
    name: App Mac
    needs: check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Signature Developer ID : seulement pour ce qui sera publié (push sur main ou tag), et seulement si les
      # secrets existent. Sinon l'app reste signée « ad hoc » : elle marche, mais macOS la bloque après un
      # téléchargement par navigateur (voir README, « Signature et notarisation »).
      - name: Certificat Developer ID
        if: github.event_name == 'push'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then echo "Pas de certificat : signature ad hoc."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signature.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificat.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificat.p12" -P "$MACOS_CERTIFICATE_PWD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificat.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then echo "::error::MACOS_CERTIFICATE ne contient pas de certificat « Developer ID Application »."; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Construire Studio.app
        run: ./native/build-mac.sh
      - name: Vérifier le binaire
        run: |
          lipo -archs native/build/Studio.app/Contents/MacOS/Studio
          codesign --verify --deep --strict --verbose native/build/Studio.app
      # Notarisation : Apple analyse l'app et délivre un ticket, agrafé dans l'app pour qu'elle s'ouvre même hors ligne.
      - name: Notariser
        if: env.SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::error::App signée mais secrets de notarisation absents (APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD)."; exit 1
          fi
          ditto -c -k --keepParent native/build/Studio.app "$RUNNER_TEMP/notarisation.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarisation.zip" --wait --timeout 15m \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple native/build/Studio.app
          # Ce que fera Gatekeeper chez l'utilisateur : doit répondre « accepted, source=Notarized Developer ID ».
          spctl --assess --type execute --verbose=2 native/build/Studio.app
      - name: Archiver
        run: ditto -c -k --keepParent native/build/Studio.app Studio-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Studio-macOS
          path: Studio-macOS.zip
          retention-days: 30

  ios:
    name: App iPhone (compilation)
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Outils
        run: brew install xcodegen
      - name: Compiler pour le simulateur
        working-directory: native
        run: |
          ./copy-web.sh build/web
          xcodegen generate --spec project.yml --quiet
          xcodebuild -project Studio.xcodeproj -scheme Studio \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO -quiet build

  release:
    name: Publication
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [macos, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # créer la Release
      packages: write   # publier le paquet dans GitHub Packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@mtthoas'
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Push sur main : version de package.json + numéro de build (ex. 1.0.42)
            VERSION="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: Studio-macOS
      - uses: actions/download-artifact@v8
        with:
          name: Studio-web
      - name: Créer la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" Studio-macOS.zip Studio-web.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Studio $TAG" --generate-notes
      - name: Publier le paquet @mtthoas/studio
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p pkg/dist && unzip -q Studio-web.zip -d pkg/dist
          cp README.md LICENSE pkg/
          node -e '
            const fs = require("fs");
            fs.writeFileSync("pkg/package.json", JSON.stringify({
              name: "@mtthoas/studio",
              version: process.env.VERSION,
              description: "Studio : notes, tâches, Linear et GitHub au même endroit, chiffrés, sans serveur. Application web compilée (dist/).",
              license: "AGPL-3.0-only",
              repository: { type: "git", url: "https://github.com/MTthoas/Studio.git" },
              files: ["dist", "README.md", "LICENSE"],
              publishConfig: { registry: "https://npm.pkg.github.com" }
            }, null, 2));'
          cd pkg && npm publish
