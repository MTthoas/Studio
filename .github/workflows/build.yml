# Studio : vérifications, builds et publication.
#   Ne pas retirer le job macOS : l'app Mac se met à jour en téléchargeant Studio-macOS.zip dans la dernière Release
#   (native/Shared/Updater.swift). Sans lui, la Release n'a que l'app web et les Mac ne reçoivent plus rien.
#   Coût : nul. Le dépôt est public, et les runners hébergés par GitHub (macOS compris) y sont gratuits et sans
#   limite de minutes, même en abonnement Free. Seule l'attente d'un runner macOS peut être longue.
#   check   → types TypeScript stricts, build, cache hors ligne complet, aucun secret dans le code
#   native  → sur UN seul runner macOS : construit Studio.app (signée Developer ID et notarisée pour une publication
#             si les secrets Apple sont renseignés, sinon signée « ad hoc »), puis vérifie que l'app iPhone compile
#             (sans signature : non installable, voir README)
#   release → à chaque push sur main (et sur un tag v…), publie une Release avec l'app Mac et l'app web,
#             et le paquet @mtthoas/studio (app web compilée) dans les Packages du dépôt
#
# Quand le build se lance :
#   - push sur main ou tag v…  → build complet + publication ;
#   - pull request (ouverte, ou branche re-poussée) → vérifications (20 s) ; les apps natives ne sont compilées que
#     si la PR touche au natif ou au build (voir « Ce que la PR touche »), et alors pour Apple Silicon seulement.
#     Le build complet et la publication se font une seule fois, sur main, après la fusion ;
#   - push sur une autre branche → rien (avant, chaque push d'agent lançait deux builds : « push » ET « pull_request »,
#     dans deux groupes de concurrence différents ; le second annulait parfois le premier, d'où des builds « au hasard »).
#   - PR fermée ou fusionnée → une exécution vide (tous les jobs sautés) dont le seul rôle est d'annuler le build de PR
#     encore en cours. Studio pousse la branche puis fusionne quelques secondes après : sans elle, le build de PR
#     (macOS compris) continuait pour rien et prenait le runner macOS dont le build de main avait besoin.
#   Une branche poussée sans PR se vérifie à la main : Actions → Build → Run workflow.
#
# Pourquoi un seul job macOS : le travail dure 2 à 3 minutes, mais un runner macOS se fait attendre 5 à 10 minutes.
# Deux jobs (Mac, iPhone) par build, deux builds par PR (la PR puis main) : l'attente se payait quatre fois.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# Par défaut, le jeton du workflow ne peut que lire le dépôt.
permissions:
  contents: read

# Un seul build à la fois par PR (ou par branche lancée à la main) : un nouveau push, ou la fusion, annule le build
# devenu périmé.
# Sur main (et sur un tag), un seul build à la fois aussi, mais jamais annulé en cours : GitHub ne garde qu'UN build en
# attente dans le groupe et remplace l'ancien par le plus récent. C'est voulu : le dernier commit de main contient
# toutes les fusions d'avant, donc une seule version « avec tout » sort, et dans l'ordre.
# Avant, chaque fusion avait son propre groupe : deux fusions rapprochées lançaient deux builds macOS en parallèle ; le
# plus ancien, servi plus tard par un runner, publiait APRÈS le plus récent (v1.0.301 après v1.0.302, sans la
# dernière fusion) et son paquet npm échouait. La garde « Déjà publié ? » du job release couvre ce qui resterait.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Vérifications
    # PR fermée ou fusionnée : rien à vérifier, l'exécution ne sert qu'à annuler le build de PR en cours.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.touche.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Une PR est testée sur son commit de fusion : son premier parent est la branche de base.
          fetch-depth: 2
      # Les apps natives embarquent l'app web telle quelle : une PR qui ne touche que src/, css/ ou la doc ne peut pas
      # casser leur compilation, et les vérifications ci-dessous couvrent déjà l'app web. Hors PR : toujours tout.
      - name: Ce que la PR touche
        id: touche
        run: |
          NATIVE=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            FILES="$(git diff --name-only HEAD^1 HEAD)" || FILES="native/"
            echo "$FILES" | grep -qE '^(native/|\.github/workflows/build\.yml$|package(-lock)?\.json$|scripts/|icons/|index\.html$|manifest\.webmanifest$)' || NATIVE=false
          fi
          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
          echo "Apps natives à compiler : $NATIVE"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Types (TypeScript strict)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Vérifications du build
        run: npm run check
      - name: Archiver l'app web
        run: cd dist && zip -qr ../Studio-web.zip . -x '*.map'
      - uses: actions/upload-artifact@v7
        with:
          name: Studio-web
          path: Studio-web.zip
          retention-days: 30

  native:
    name: Apps Mac et iPhone
    needs: check
    if: needs.check.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Une PR vérifie que le code compile : une architecture suffit. La publication garde le binaire universel.
      STUDIO_ARCHS: ${{ github.event_name == 'pull_request' && 'arm64' || 'arm64 x86_64' }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Signature Developer ID : seulement pour ce qui sera publié (push sur main ou tag), et seulement si les
      # secrets existent. Sinon l'app reste signée « ad hoc » : elle marche, mais macOS la bloque après un
      # téléchargement par navigateur (voir README, « Signature et notarisation »).
      - name: Certificat Developer ID
        if: github.event_name == 'push'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then echo "Pas de certificat : signature ad hoc."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signature.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificat.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificat.p12" -P "$MACOS_CERTIFICATE_PWD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificat.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then echo "::error::MACOS_CERTIFICATE ne contient pas de certificat « Developer ID Application »."; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Construire Studio.app
        run: ./native/build-mac.sh
      - name: Vérifier le binaire
        run: |
          lipo -archs native/build/Studio.app/Contents/MacOS/Studio
          codesign --verify --deep --strict --verbose native/build/Studio.app
      # Notarisation : Apple analyse l'app et délivre un ticket, agrafé dans l'app pour qu'elle s'ouvre même hors ligne.
      - name: Notariser
        if: env.SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::error::App signée mais secrets de notarisation absents (APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD)."; exit 1
          fi
          ditto -c -k --keepParent native/build/Studio.app "$RUNNER_TEMP/notarisation.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarisation.zip" --wait --timeout 15m \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple native/build/Studio.app
          # Ce que fera Gatekeeper chez l'utilisateur : doit répondre « accepted, source=Notarized Developer ID ».
          spctl --assess --type execute --verbose=2 native/build/Studio.app
      - name: Archiver
        run: ditto -c -k --keepParent native/build/Studio.app Studio-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Studio-macOS
          path: Studio-macOS.zip
          retention-days: 30

      # L'app web vient d'être construite pour l'app Mac (dist/) : elle est recopiée telle quelle, sans second build.
      - name: Outils iPhone
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Compiler l'app iPhone (simulateur)
        working-directory: native
        run: |
          rm -rf build/web && mkdir -p build/web && cp -R ../dist/. build/web/ && find build/web -name '*.map' -delete
          xcodegen generate --spec project.yml --quiet
          xcodebuild -project Studio.xcodeproj -scheme Studio \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO -quiet build

  release:
    name: Publication
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # créer la Release
      packages: write   # publier le paquet dans GitHub Packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Tout l'historique : la garde ci-dessous compare ce commit à celui de la dernière Release.
          fetch-depth: 0
      # Une Release plus récente qui contient déjà ce commit : publier celle-ci la ferait passer pour la dernière
      # (l'updater prend /releases/latest) sans les fusions d'après, et le paquet npm, de version plus basse, échoue.
      - name: Déjà publié ?
        id: deja
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .target_commitish 2>/dev/null || true)"
          if [[ "$GITHUB_REF" == refs/heads/main && -n "$LAST" && "$LAST" != "$GITHUB_SHA" ]] \
             && git merge-base --is-ancestor "$GITHUB_SHA" "$LAST" 2>/dev/null; then
            echo "Ce commit est déjà dans la Release de $LAST : rien à publier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.deja.outputs.skip != 'true'
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@mtthoas'
      - name: Version
        id: v
        if: steps.deja.outputs.skip != 'true'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Push sur main : version de package.json + numéro de build (ex. 1.0.42)
            VERSION="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: steps.deja.outputs.skip != 'true'
        with:
          name: Studio-macOS
      - uses: actions/download-artifact@v8
        if: steps.deja.outputs.skip != 'true'
        with:
          name: Studio-web
      - name: Créer la Release
        if: steps.deja.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" Studio-macOS.zip Studio-web.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Studio $TAG" --generate-notes
      - name: Publier le paquet @mtthoas/studio
        if: steps.deja.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p pkg/dist && unzip -q Studio-web.zip -d pkg/dist
          cp README.md LICENSE pkg/
          node -e '
            const fs = require("fs");
            fs.writeFileSync("pkg/package.json", JSON.stringify({
              name: "@mtthoas/studio",
              version: process.env.VERSION,
              description: "Studio : notes, tâches, Linear et GitHub au même endroit, chiffrés, sans serveur. Application web compilée (dist/).",
              license: "AGPL-3.0-only",
              repository: { type: "git", url: "https://github.com/MTthoas/Studio.git" },
              files: ["dist", "README.md", "LICENSE"],
              publishConfig: { registry: "https://npm.pkg.github.com" }
            }, null, 2));'
          cd pkg && npm publish
